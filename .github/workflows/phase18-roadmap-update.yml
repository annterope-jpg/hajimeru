name: Phase 18 roadmap update

on:
  push:
    branches:
      - phase/18-person-led-sharing-reflection
    paths:
      - .phase18-roadmap-trigger

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase/18-person-led-sharing-reflection

      - name: Update Phase 18 roadmap record
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('更新日：2026-09-13', '更新日：2026-09-14', 1)
          text = text.replace(
              '| 18 | 本人主導の共有要約とふりかえりを作る | 未着手 |',
              '| 18 | 本人主導の共有要約とふりかえりを作る | 完了（2026-09-14） |',
              1,
          )
          old_tail = '''## 次回：Phase 18

本人主導の共有要約とふりかえりを作る。共有範囲を本人が選び、隠れた専門職評価や自動共有を作らない。'''
          new_tail = '''## Phase 18の完了記録

過去の一歩から、本人が「取り組んだ課題」「今回の作業仮説」「選んだ小さな実験」「戻るための目印」「ふりかえり」を項目別に選び、共有前に内容を確認できる共有用メモを追加した。共有画面は何も選ばれていない状態で開き、本人が共有ボタンを押した場合だけOSの共有画面へテキストを渡す。共有しなくても元の記録は変わらない。

共有用メモには0〜10の点数、未選択項目、診断・原因推定、専門職だけに見える評価、受取人ID、共有履歴を含めない。作業仮説は既に計画へ残っている本人回答由来の仮説だけを非診断的な言葉へ変換し、欠測や未回答から補わない。ふりかえりも数値差ではなく、本人が残した質的な範囲だけを示す。

変更箇所は `src/domain/shareSummary.ts`、`app/share-summary.tsx`、`app/(tabs)/insights.tsx`、`app/_layout.tsx`、`tests/domain/share-summary.test.ts`、`docs/SHARING_AND_REFLECTION.md`。共有選択は画面内だけに置き、保存・同期・AI送信・自動共有を追加していない。

既知の限界は、OS共有画面を開いた後の送信先・二次利用・受取側保存をアプリから制御できないこと、画面撮影や手作業での転記を防げないこと、共有項目名・文章量・共同利用時の圧力感を当事者とセラピストでまだ評価していないこと。これらはPhase 19の共同パイロットで確認する。

## 次回：Phase 19

当事者・セラピスト共同パイロットを行う。実装済み機能の有効性を前提にせず、理解しやすさ、圧力感、誤解、共有境界、安全性、実機アクセシビリティを確認する。'''
          if old_tail not in text:
              raise SystemExit('expected Phase 18 tail not found; refusing to rewrite ROADMAP')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit roadmap only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No roadmap change needed"
            exit 0
          fi
          git commit -m "Mark Phase 18 complete in roadmap"
          git push origin HEAD:phase/18-person-led-sharing-reflection
